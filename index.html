<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f2; --panel:#ffffff; --ink:#1b1f24; --muted:#6a717b; --line:#dfe2e0; --line2:#c9ceca;
  --accent:#1f4e8c; --accent-ink:#ffffff; --accent-soft:#e6eef8; --ok:#1e7a4c; --ok-soft:#e3f3ea;
  --warn:#9a6400; --warn-soft:#fff4dc; --danger:#b3261e; --radius:8px;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Roboto,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
h1,h2,h3,.cond{font-family:"Roboto Condensed",Roboto,sans-serif;letter-spacing:.01em}
h1{font-size:22px;margin:0}
h2{font-size:17px;margin:0 0 12px}
h3{font-size:15px;margin:0 0 8px}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line2);border-radius:6px;background:#fff;min-height:38px}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
input[type=checkbox]{width:auto;min-height:0}
label.f{display:block;font-size:12.5px;color:var(--muted);margin:0 0 4px;font-weight:500}
.btn{text-decoration:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:#fff;border-radius:6px;padding:8px 14px;cursor:pointer;min-height:38px;white-space:nowrap;font-weight:500}
.btn:hover{background:#f6f7f6}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{background:#16202c;color:#fff;position:sticky;top:0;z-index:20}
header.top .wrap{display:flex;align-items:center;gap:16px;min-height:56px;flex-wrap:wrap}
header.top .brand{font-family:"Roboto Condensed";font-weight:700;font-size:17px;letter-spacing:.02em}
header.top .brand small{display:block;font-weight:500;font-size:11.5px;opacity:.7;letter-spacing:.04em}
nav.tabs{display:flex;gap:4px;margin-left:auto}
nav.tabs button{background:transparent;border:0;color:#c9d2dc;padding:8px 12px;border-radius:6px;cursor:pointer;font-weight:500}
nav.tabs button.on{background:rgba(255,255,255,.12);color:#fff}
main{padding:20px 0 80px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}}
.muted{color:var(--muted)}
.sp{flex:1}
.badge{display:inline-block;font-size:12px;font-weight:500;padding:2px 8px;border-radius:99px;background:#eef0ee;color:#3d434a;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.acc{background:var(--accent-soft);color:var(--accent)}
.mt{margin-top:16px}.mt2{margin-top:24px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input[type=search]{max-width:320px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:#fff;border-radius:99px;padding:4px 12px;cursor:pointer;font-size:13px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* Order list */
.olist{display:grid;gap:10px}
.ocard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;cursor:pointer;box-shadow:var(--shadow)}
.ocard:hover{border-color:var(--accent)}
.ocard .no{font-family:"Roboto Condensed";font-weight:700;font-size:18px;min-width:110px}
.ocard .models{display:grid;gap:6px;margin-top:6px}
.srow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.oact{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
@media (max-width:640px){.oact{align-items:flex-start;flex-direction:row}}
@media (max-width:640px){.ocard{grid-template-columns:1fr}}

/* Editor */
.ed-head{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
.mtabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
.mtabs button{border:1px solid transparent;border-bottom:0;background:transparent;padding:8px 14px;border-radius:6px 6px 0 0;cursor:pointer;font-weight:500;margin-bottom:-1px}
.mtabs button.on{background:#fff;border-color:var(--line);color:var(--accent)}
.stepper{display:flex;gap:0;flex-wrap:wrap;margin:4px 0 16px}
.stepper button{flex:1;min-width:120px;border:1px solid var(--line2);background:#fff;padding:8px 10px;font-size:12.5px;cursor:pointer;text-align:left;margin-left:-1px}
.stepper button:first-child{border-radius:6px 0 0 6px;margin-left:0}
.stepper button:last-child{border-radius:0 6px 6px 0}
.stepper button b{display:block;font-size:11px;color:var(--muted)}
.stepper button.done{background:var(--ok-soft)}
.stepper button.cur{background:var(--accent);color:#fff;border-color:var(--accent)}
.stepper button.cur b{color:#cfe0f5}
.stepper button.skip{opacity:.45}
.szc{border:1px solid var(--line2);background:#fff;border-radius:5px;min-width:46px;padding:4px 8px;cursor:pointer;font-weight:500}
.szc.on{background:#e00000;border-color:#e00000;color:#fff}
.sizes tr.has td{background:#fff4f4}
.mlist{display:flex;gap:8px;flex-wrap:wrap}
.mchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:8px;padding:6px 10px 6px 6px;background:#fff;cursor:pointer}
.mchip img,.mchip .ph{width:40px;height:40px;border-radius:5px;object-fit:cover;background:#eee}
.mchip.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ccard.sel{outline:3px solid var(--accent);outline-offset:-3px}
.ccard .chk{position:absolute;top:6px;right:6px;background:var(--accent);color:#fff;border-radius:50%;width:24px;height:24px;display:none;align-items:center;justify-content:center;font-weight:700}
.ccard{position:relative}.ccard.sel .chk{display:flex}
.thanks{max-width:560px;margin:14vh auto;text-align:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:32px 24px}
.ptabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:4px 0 18px}
.ptabs button{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:10px 12px;text-align:left;cursor:pointer}
.ptabs button b{display:block;font-family:"Roboto Condensed";font-size:16px}
.ptabs button small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.ptabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ptabs button.on small{color:#d4e2f4}
@media (max-width:640px){.ptabs{grid-template-columns:1fr}}
.stepsel{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.stepsel select{width:auto;min-height:32px;padding:4px 8px}
.sec{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;box-shadow:var(--shadow)}
.sec>summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:10px;font-family:"Roboto Condensed";font-weight:700;font-size:15.5px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary .n{background:var(--ink);color:#fff;border-radius:4px;font-size:12px;min-width:22px;text-align:center;padding:1px 5px}
.sec>summary::after{content:"▾";margin-left:auto;color:var(--muted)}
.sec:not([open])>summary::after{content:"▸"}
.sec .body{padding:4px 16px 16px}
.grouphead{font-family:"Roboto Condensed";font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:26px 0 10px;display:flex;align-items:center;gap:10px}
.grouphead::after{content:"";flex:1;height:1px;background:var(--line2)}
table.t{width:100%;border-collapse:collapse}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:middle}
table.t th{font-size:12px;color:var(--muted);font-weight:500}
table.t input,table.t select{min-height:34px;padding:5px 8px}
.sizes{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.sizes{grid-template-columns:1fr}}
.sizes table td:first-child,.sizes table td:nth-child(2){width:64px}
.sizes input{text-align:right}
.tot{font-weight:700;font-size:15px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:96px;height:96px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#f0f1f0}
.thumb img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.thumb .x{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:4px;width:22px;height:22px;cursor:pointer;line-height:1}
.addimg{width:96px;height:96px;border:1.5px dashed var(--line2);border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-size:12.5px;text-align:center;padding:6px;background:#fafbfa}
.addimg input{display:none}
.model-pick{display:flex;gap:12px;align-items:center;border:1px solid var(--line2);border-radius:8px;padding:10px;background:#fafbfa}
.model-pick img{width:72px;height:72px;object-fit:cover;border-radius:6px;background:#eee}
.savebar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:15;box-shadow:0 -2px 10px rgba(0,0,0,.05)}
.savebar .wrap{display:flex;align-items:center;gap:10px;min-height:58px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.savebar.sent{background:var(--warn-soft)}
.status{font-size:13px;color:var(--muted)}
.status.err{color:var(--danger)}

/* Catalog */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.ccard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column}
.ccard:hover{border-color:var(--accent)}
.ccard .im{height:180px;overflow:hidden;background:#eef0ee;display:flex;gap:1px}
.ccard .im img{flex:1;min-width:0;object-fit:cover;height:100%}
.ccard .im .noimg{margin:auto;color:var(--muted);font-size:12px}
.ccard .tx{padding:8px 10px}
.ccard .code{font-family:"Roboto Condensed";font-weight:700}
.ccard .desc{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(15,20,26,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
.modal .box{background:#fff;border-radius:10px;width:100%;max-width:880px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal .box.sm{max-width:480px}
.modal .mh{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.modal .mh h2{margin:0}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:80;display:flex;align-items:center;justify-content:center}
.lightbox img{max-width:96vw;max-height:90vh;object-fit:contain;cursor:zoom-in;transition:transform .15s}
.lightbox img.z{transform:scale(2);cursor:zoom-out}
.lightbox .lb-x,.lightbox .lb-p,.lightbox .lb-n{position:fixed;background:rgba(255,255,255,.14);border:0;color:#fff;font-size:26px;width:48px;height:48px;border-radius:50%;cursor:pointer}
.lightbox .lb-x{top:14px;right:14px}
.lightbox .lb-p{left:14px;top:50%}
.lightbox .lb-n{right:14px;top:50%}
.lightbox .lb-c{position:fixed;bottom:14px;left:0;right:0;text-align:center;color:#ddd;font-size:14px}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:#16202c;color:#fff;padding:10px 16px;border-radius:8px;z-index:90;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}

/* Factory view (screen) */
.fv{max-width:1100px;margin:0 auto;padding:16px}
.fv-head{background:#16202c;color:#fff;border-radius:10px;padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:10px}
.fv-head .big{font-family:"Roboto Condensed";font-size:30px;font-weight:700;line-height:1.1}
.fv-head .meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;font-size:14px;opacity:.9}
.fv-head .meta b{display:block;font-size:11px;opacity:.6;font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.fv-gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.fv-gal figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative}
.fv-gal figure img{width:100%;height:auto;max-height:78vh;object-fit:contain;display:block;background:#fff;cursor:zoom-in}
.fv-gal figcaption{position:absolute;left:8px;top:8px;background:rgba(22,32,44,.82);color:#fff;font-size:12.5px;padding:3px 9px;border-radius:99px;font-weight:500}
@media (max-width:700px){.fv-gal{grid-template-columns:1fr}}
.fv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
@media (max-width:760px){.fv-grid{grid-template-columns:1fr}}
.fv-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.fv-card.full{grid-column:1/-1}
.fv-card h3{font-family:"Roboto Condensed";font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.fv table.t td,.fv table.t th{font-size:14px}
.fv .sizebig td{font-size:16px}
.fv .sizebig td.q{font-weight:700;text-align:right}
.rev{background:var(--warn-soft);border:1px solid #f0d9a6;border-radius:10px;padding:10px 14px;margin-top:14px;font-size:14px}
.fv-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.err-page{max-width:520px;margin:12vh auto;text-align:center;padding:24px}

/* Print sheet */
.print-only{display:none}
@media print{
  @page{size:A4;margin:8mm}
  html,body{background:#fff;font-size:10.5px}
  .no-print,header.top,.savebar,.fv-actions,.fv-screen{display:none !important}
  .print-only{display:block !important}
  .ps{color:#000}
  .ps table{width:100%;border-collapse:collapse;margin-bottom:4px}
  .ps td,.ps th{border:1px solid #000;padding:2px 4px;vertical-align:top;font-size:10px}
  .ps th{background:#dfe9f5;font-weight:700;text-align:left}
  .ps .hd td{background:#eef3e6}
  .ps .imgs{display:flex;gap:4px;flex-wrap:wrap}
  .ps .imgs img{height:62mm;width:auto;max-width:48%;object-fit:contain;border:1px solid #999}
  .ps .page{page-break-after:auto}
  .fvs ~ .fvs .ps{break-before:page;page-break-before:always}
  .ps .page:last-child{page-break-after:auto}
  .ps .sign{margin-top:8px;line-height:2}
}
</style>
</head>

<script>

function copy(text){
  function fallback(){ var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); var ok=false; try{ ok=document.execCommand('copy'); }catch(e){} ta.remove(); return ok; }
  var done=function(){ toast('Линк хуулагдлаа'); };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done,function(){ fallback()?done():showLink(text); }); }
  else { fallback()?done():showLink(text); }
}

function modal(html,cls){ closeModal(); var m=document.createElement('div'); m.className='modal'; m.id='modal'; m.innerHTML='<div class="box '+(cls||'')+'">'+html+'</div>'; m.addEventListener('click',function(e){ if(e.target===m||e.target.hasAttribute('data-close')) closeModal(); }); document.body.appendChild(m); return m; }
function closeModal(){ var m=$('#modal'); if(m) m.remove(); }
function lightbox(list,i){
  var lb=document.createElement('div'); lb.className='lightbox';
  function draw(){ lb.innerHTML='<img src="'+img(list[i].id,2400)+'"><button class="lb-x">✕</button>'+(list.length>1?'<button class="lb-p">‹</button><button class="lb-n">›</button>':'')+'<div class="lb-c">'+esc(list[i].cap||'')+(list.length>1?' · '+(i+1)+'/'+list.length:'')+'</div>'; }
  draw();
  lb.addEventListener('click',function(e){
    if(e.target.tagName==='IMG'){ e.target.classList.toggle('z'); return; }
    if(e.target.classList.contains('lb-p')){ i=(i-1+list.length)%list.length; draw(); return; }
    if(e.target.classList.contains('lb-n')){ i=(i+1)%list.length; draw(); return; }
    lb.remove(); document.removeEventListener('keydown',key);
  });
  function key(e){ if(e.key==='Escape'){ lb.remove(); document.removeEventListener('keydown',key); } if(e.key==='ArrowRight'){i=(i+1)%list.length;draw();} if(e.key==='ArrowLeft'){i=(i-1+list.length)%list.length;draw();} }
  document.addEventListener('keydown',key);
  document.body.appendChild(lb);
}

/* ================= Зураг байршуулах ================= */
function resizeFile(file,max){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(){ var im=new Image(); im.onload=function(){ var w=im.width,h=im.height,sc=Math.min(1,max/Math.max(w,h)); var c=document.createElement('canvas'); c.width=Math.round(w*sc); c.height=Math.round(h*sc); var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',0.85).split(',')[1]); }; im.onerror=rej; im.src=r.result; };
    r.onerror=rej; r.readAsDataURL(file);
  });
}
function uploadFiles(files,name,kind){
  var au=auth(); if(kind!=='catalog'&&S.order) au.order=S.order;
  return Promise.all([].slice.call(files).map(function(f){ return resizeFile(f,1800).then(function(b64){ return api('apiUpload',au,b64,name||'zurag',kind||'order'); }); }));
}
function thumbsHtml(ids,path,editable,cap){
  ids=ids||[];
  var h='<div class="thumbs">';
  ids.forEach(function(id,i){ h+='<div class="thumb"><img loading="lazy" src="'+img(id,300)+'" data-lb="'+esc(path)+'" data-i="'+i+'" data-cap="'+esc(cap||'')+'">'+(editable?'<button class="x" data-rmimg="'+esc(path)+'" data-i="'+i+'" title="Устгах">✕</button>':'')+'</div>'; });
  if(editable) h+='<label class="addimg">+ Зураг нэмэх<input type="file" accept="image/*" multiple data-upimg="'+esc(path)+'"></label>';
  return h+'</div>';
}

function setStatus(t,err){ S.status=t; var e=$('#st'); if(e){ e.textContent=t; e.className='status'+(err?' err':''); } }

function markDirty(path){
  var top=path.split('.')[0];
  S.pending[top]=true;
  // захиалгын түвшний талбарыг бусад таб-д хуулна
  if(['customer','recvDate','dueDate','logo','sameSizes'].indexOf(top)>=0) S.sheets.forEach(function(x){ x.data[top]=D()[top]; });
  if(D().sameSizes&&['sizes','sizeSel','extraSizes'].indexOf(top)>=0) S.sheets.forEach(function(x){ if(x!==curSheet()) x.data[top]=JSON.parse(JSON.stringify(D()[top]||(top==='extraSizes'?[]:{}))); });
  if(curSheet().sent&&!isCust()){ setStatus('Хадгалаагүй өөрчлөлт байна'); return; }
  setStatus('Хадгалж байна…');
  clearTimeout(S.saveTimer); S.saveTimer=setTimeout(flushSave,1200);
}
function flushSave(note){
  clearTimeout(S.saveTimer);
  var keys=Object.keys(S.pending); if(!keys.length) return Promise.resolve();
  var s=curSheet(), patch={}; keys.forEach(function(k){ patch[k]=s.data[k]; }); S.pending={};
  setStatus('Хадгалж байна…');
  return api('apiSave',auth(),s.id,patch,note||'').then(function(o){
    s.updated=o.updated; s.sent=o.sent; s.data.revisions=o.data.revisions; if(!isCust()) syncList(Object.assign({},s));

    }
    if(e.target.hasAttribute&&e.target.hasAttribute('data-samesz')){ var on=e.target.checked; if(on&&!confirm('Энэ загварын размер, тоог бусад '+(S.sheets.length-1)+' загварт хуулах уу? Тэдгээрийн одоогийн размер солигдоно.')){ e.target.checked=false; return; } D().sameSizes=on; markDirty('sameSizes'); if(on){ ['sizes','sizeSel','extraSizes'].forEach(function(k){ markDirty(k); }); } rerender(); return; }
    if(e.target.hasAttribute&&e.target.hasAttribute('data-dtoggle')){ S.dEdit[curSheet().id]=e.target.checked; rerender(); return; }
    var k=e.target.getAttribute&&e.target.getAttribute('data-k');
    if(k==='isNew'){ rerender(); }
  };
  app.onclick=function(e){
    var t=e.target.closest('button,img[data-lb]'); if(!t) return;
    if(t.hasAttribute('data-lb')){ var p=t.getAttribute('data-lb'); var ids=getPath(D(),p)||[]; lightbox(ids.map(function(id){ return {id:id,cap:t.getAttribute('data-cap')}; }),Number(t.getAttribute('data-i'))); return; }
    if(t.hasAttribute('data-rmimg')){ var p2=t.getAttribute('data-rmimg'); var a=(getPath(D(),p2)||[]).slice(); a.splice(Number(t.getAttribute('data-i')),1); setPath(D(),p2,a); markDirty(p2); rerender(); return; }
    if(t.hasAttribute('data-add')){ var k=t.getAttribute('data-add'); var arr=(D()[k]||[]).slice(); arr.push(k==='extraSizes'?{gender:'M'}:{}); D()[k]=arr; markDirty(k); rerender(); return; }
    if(t.hasAttribute('data-rm')){ var k2=t.getAttribute('data-rm'); var arr2=(D()[k2]||[]).slice(); arr2.splice(Number(t.getAttribute('data-i')),1); D()[k2]=arr2; markDirty(k2); rerender(); return; }
    if(t.hasAttribute('data-szsel')){ var q=t.getAttribute('data-szsel').split('|'); var cur=getPath(D(),'sizeSel.'+q[0]+'.'+q[1]+'.'+q[2]); setPath(D(),'sizeSel.'+q[0]+'.'+q[1]+'.'+q[2],!cur); t.classList.toggle('on',!cur); markDirty('sizeSel'); return; }
    if(t.hasAttribute('data-et')){ if(S.etab==='c'&&!isCust()){ var cc=catFind(D().modelCode,D().modelCat); if(cc&&!cc.design&&Object.keys(designOf(D())).length) saveDesign(true); } flushSave(); S.etab=t.getAttribute('data-et'); rerender(); window.scrollTo(0,0); return; }
    if(t.hasAttribute('data-mt')){ var i=Number(t.getAttribute('data-mt')); flushSave(); S.cur=i; S.status=''; rerender(); return; }
    if(t.hasAttribute('data-step')){ D().step=Number(t.getAttribute('data-step')); markDirty('step'); rerender(); return; }
    switch(t.id){
      case 'back': leaveEditor(function(){ render(); }); break;
      case 'addSheet': addSheet(); break;
      case 'addCustom': addCustom(); break;
      case 'pickModel': pickModel('replace'); break;
      case 'pickModels': pickModel('add'); break;
      case 'codeEntry': codeEntry(); break;
      case 'saveDesign': saveDesign(false); break;
      case 'loadDesign': if(confirm('Энэ захиалгад хийсэн засварыг арилгаж, Code-ийн хувилбарыг буцааж оруулах уу?')){ applyDesign(D(),catFind(D().modelCode,D().modelCat),true); rerender(); } break;
      case 'custSubmit': custSubmit(); break;
      case 'custLink': copy(custUrl(curSheet())); break;
      case 'facLink': copy(factoryUrl(curSheet())); break;
      case 'facAll': copy(orderFactoryUrl(S.sheets)); break;
      case 'facAllOpen': window.open(orderFactoryUrl(S.sheets),'_blank'); break;
      case 'facOpen': window.open(factoryUrl(curSheet()),'_blank'); break;
      case 'preview': previewFactory(); break;
      case 'send': sendFactory(); break;
      case 'saveRev': saveRevision(); break;
      case 'delSheet': delSheet(); break;
      case 'delOrder': deleteOrder(S.order); break;
    }
  };
}

/* ================= Каталогоос сонгох ================= */
var DESIGN_KEYS=['ironTpl','sewTpl','pocketTpl','orts','tpl','aux'];
function designOf(d){ var o={}; DESIGN_KEYS.forEach(function(k){ if(d[k]!=null&&d[k]!==''&&!(Array.isArray(d[k])&&!d[k].length)){ var v=JSON.parse(JSON.stringify(d[k])); if(Array.isArray(v)&&ORDER_COLS[k]) v=v.map(function(r){ ORDER_COLS[k].forEach(function(c){ delete r[c]; }); return r; }); o[k]=v; } }); return o; }
function applyDesign(d,c,force){
  if(!c||!c.design) return;
  DESIGN_KEYS.forEach(function(k){ var v=c.design[k]; if(v==null) return; var empty=d[k]==null||d[k]===''||(Array.isArray(d[k])&&!d[k].length); if(force||empty){ var old=d[k]; d[k]=JSON.parse(JSON.stringify(v)); if(Array.isArray(d[k])&&Array.isArray(old)&&ORDER_COLS[k]) d[k].forEach(function(r){ var o=old.filter(function(x){ return x.name===r.name; })[0]; if(o) ORDER_COLS[k].forEach(function(c){ if(o[c]) r[c]=o[c]; }); }); if(d===D()) markDirty(k); } });
}
function applyModel(d,it){
  d.modelCode=it.code; d.modelCat=it.cat; if(!d.modelDesc) d.modelDesc=it.desc;
  if(d===D()){ markDirty('modelCode'); markDirty('modelCat'); markDirty('modelDesc'); }
  applyDesign(d,it,false);
}
function saveDesign(silent){
  var d=D(); if(!d.modelCode){ if(!silent) alert('Эхлээд загварын код сонгоно уу'); return Promise.resolve(); }
  var des=designOf(d); if(!Object.keys(des).length){ if(!silent) alert('Дизайнерын хэсэг хоосон байна'); return Promise.resolve(); }
  return api('apiSaveDesign',auth(),d.modelCat||'',d.modelCode,des).then(function(c){ S.catalog=c; S.dEdit[curSheet().id]=false; if(!silent){ toast(d.modelCode+' загварын дизайн Code-д хадгалагдлаа'); rerender(); } })
    .catch(function(e){ if(!silent) alert(e.message); });
}
function pickModel(mode){
  var st={q:'',cat:''}, picked=[], multi=mode==='add';
  var m=modal('<div class="mh"><h2>'+(multi?'Code-оос загварууд сонгох':'Загвар солих')+'</h2><span class="sp"></span><button class="btn ghost" data-close>✕</button></div>'+(multi?'<p class="muted" style="margin-top:0">Хэд хэдэн загвар дарж сонгоод доод талын товчийг дарна. Загвар бүр тусдаа таб болно.</p>':'')+'<div class="toolbar"><input type="search" id="pq" placeholder="Код эсвэл тодорхойлолтоор хайх"></div><div class="chips" id="pc" style="margin-bottom:12px"></div><div class="cgrid" id="pg"></div>'+
    (multi?'<div style="position:sticky;bottom:-24px;background:#fff;padding:12px 0;margin-top:12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center"><span id="pn" class="muted">0 загвар сонгосон</span><span class="sp"></span><button class="btn pri" id="pok" disabled>Сонгосон загваруудыг нэмэх</button></div>':''));
  m.querySelector('.box').style.maxWidth='1100px';
  function draw(){
    $('#pc',m).innerHTML=[''].concat(cats()).map(function(c){ return '<button class="chip '+(st.cat===c?'on':'')+'" data-c="'+esc(c)+'">'+(c||'Бүгд')+'</button>'; }).join('');
    $('#pg',m).innerHTML=filterCat(st).slice(0,240).map(function(x){ return ccardHtml(x,picked.indexOf(x._i)>=0); }).join('')||'<p class="muted">Олдсонгүй</p>';
  }
  draw();

  m.addEventListener('click',function(e){
    var c=e.target.closest('[data-c]'); if(c){ st.cat=c.getAttribute('data-c'); draw(); return; }
    if(e.target.id==='pok'){ closeModal(); addModels(picked.map(function(i){ return S.catalog[i]; })); return; }
    var k=e.target.closest('[data-ck]'); if(!k) return;
    var i=Number(k.getAttribute('data-ck'));
    if(!multi){ applyModel(D(),S.catalog[i]); closeModal(); rerender(); return; }

    k.classList.toggle('sel',j<0);
    $('#pn',m).textContent=picked.length+' загвар сонгосон'; $('#pok',m).disabled=!picked.length;
  });
}
function findCodes(txt){
  var codes=String(txt||'').toUpperCase().split(/[\s,;]+/).filter(String), found=[], missing=[];
  codes.forEach(function(c){ var it=S.catalog.filter(function(x){ return String(x.code).toUpperCase()===c; })[0]; if(it){ if(found.indexOf(it)<0) found.push(it); } else missing.push(c); });
  return {found:found,missing:missing,last:codes[codes.length-1]||''};
}
function codeEntry(){
  var m=modal('<div class="mh"><h2>Код оруулах</h2><span class="sp"></span><button class="btn ghost" data-close>✕</button></div>'+
    '<input id="ce" placeholder="Жишээ нь: W1012  эсвэл  W1012, W2001" autocomplete="off" style="font-size:18px;text-transform:uppercase"><p class="muted" style="font-size:12.5px;margin:6px 0 12px">Хэд хэдэн кодыг таслалаар тусгаарлаж бичиж болно. Enter дарахад нэмэгдэнэ.</p>'+
    '<div id="cep" class="cgrid"></div><div class="row mt"><span id="cem" class="muted" style="font-size:13px"></span><span class="sp"></span><button class="btn pri" id="ceok" disabled>Нэмэх</button></div>');
  m.querySelector('.box').style.maxWidth='760px';
  var inpEl=$('#ce',m); setTimeout(function(){ inpEl.focus(); },50);
  function draw(){
    var r=findCodes(inpEl.value), html=r.found.map(function(x){ return ccardHtml(x,true); }).join('');
    if(!r.found.length&&r.last){ var q=r.last; html=S.catalog.map(function(x,i){ x._i=i; return x; }).filter(function(x){ return String(x.code).toUpperCase().indexOf(q)===0; }).slice(0,8).map(function(x){ return ccardHtml(x,false); }).join(''); if(html) html='<p class="muted" style="grid-column:1/-1;margin:0">Төстэй кодууд (дарж сонгоно):</p>'+html; }
    $('#cep',m).innerHTML=html;
    $('#cem',m).textContent=(r.found.length?r.found.length+' загвар олдлоо. ':'')+(r.missing.length?'Олдоогүй: '+r.missing.join(', '):'');
    $('#ceok',m).disabled=!r.found.length;
  }
  function go(){ var r=findCodes(inpEl.value); if(!r.found.length) return; closeModal(); addModels(r.found); }
  inpEl.oninput=draw;
  inpEl.onkeydown=function(e){ if(e.key==='Enter'){ e.preventDefault(); go(); } };
  m.addEventListener('click',function(e){
    if(e.target.id==='ceok'){ go(); return; }

    var parts=inpEl.value.split(/[\s,;]+/).filter(String); if(parts.length&&!findCodes(parts[parts.length-1]).found.length) parts.pop(); parts.push(it.code);
    inpEl.value=parts.join(', '); draw(); inpEl.focus();
  });

function addModels(items){

    '<tr><th>Өнгө</th><td colspan="3">Их бие: '+esc(col.body||'—')+' · Оруулга: '+esc(col.insert||'—')+' · Дотор: '+esc(col.lining||'—')+'</td></tr></table>';
  var lrows=POS4.filter(function(p){ var x=lg[p]; return x&&(x.type||x.color||x.size||x.note); });
  if(lrows.length) h+='<table><tr><th>Лого байрлал</th><th>Төрөл</th><th>Өнгө</th><th>Хэмжээ/см</th><th>Тайлбар</th></tr>'+lrows.map(function(p){ var x=lg[p]; return '<tr><td>'+p+'</td><td>'+esc(x.type||'')+'</td><td>'+esc(x.color||'')+'</td><td>'+esc(x.size||'')+'</td><td>'+esc(x.note||'')+'</td></tr>'; }).join('')+'</table>';
  h+='<table><tr><td style="width:42%"><div class="imgs">'+imgs.slice(0,4).map(function(x){ return '<img src="'+img(x.id,1000)+'">'; }).join('')+'</div></td><td>';
  h+='<table><tr><th>Орц</th><th>Өнгө-Өргөн</th><th>Код</th></tr>'+(d.orts||[]).map(function(r){ return '<tr><td>'+esc(r.name)+'</td><td>'+esc(r.color)+'</td><td>'+esc(r.code)+'</td></tr>'; }).join('')+'</table>';
  if((d.tpl||[]).length) h+='<table><tr><th>Эсгүүр-ашиглах шаблон</th><th>Код</th><th>Зурах/CLO</th></tr>'+d.tpl.map(function(r){ return '<tr><td>'+esc(r.name)+'</td><td>'+esc(r.code)+'</td><td>'+(r.clo?'✓':'')+'</td></tr>'; }).join('')+'</table>';
  if((d.aux||[]).length) h+='<table><tr><th>Туслах материал</th><th>Өнгө</th><th>Код</th></tr>'+d.aux.map(function(r){ return '<tr><td>'+esc(r.name)+(r.lengths?'<br><small>'+esc(r.lengths)+'</small>':'')+'</td><td>'+esc(r.color)+'</td><td>'+esc(r.code)+'</td></tr>'; }).join('')+'</table>';
  var szRows=sizeRows(d);

  h+='<table><tr><th>Размер</th><th>Тоо</th><th>Хүйс</th></tr>'+szRows.map(function(r){ return '<tr><td>'+esc(r[0])+'</td><td>'+r[1]+'ш</td><td>'+r[2]+'</td></tr>'; }).join('')+'<tr><th>Нийт: '+total(d)+'ш</th><th colspan="2">ЭР '+gTotal(d,'M')+' · ЭМ '+gTotal(d,'F')+'</th></tr></table>';
  h+='</td></tr></table>';
  var other=[]; ['khav','soilt','tsats','halaas','dotor'].forEach(function(k){ optRows(k,d).forEach(function(r){ other.push([OPT[k].title].concat(r)); }); });
  if(other.length) h+='<table><tr><th>Төрөл</th><th>Байрлал</th><th>Сонголт</th><th>Тайлбар</th></tr>'+other.map(function(r){ return '<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td><td>'+esc(r[3])+'</td></tr>'; }).join('')+'</table>';
  if(d.note||d.custNote||d.salesNote) h+='<table><tr><th>Тэмдэглэл</th></tr><tr><td style="white-space:pre-wrap">'+esc([d.note,d.salesNote,d.custNote].filter(Boolean).join('\n'))+'</td></tr></table>';
  (d.revisions||[]).forEach(function(r){ h+='<div><b>Өөрчлөлт '+esc(r.at)+':</b> '+esc(r.note)+'</div>'; });
  h+='<div class="sign">Боловсруулсан: ........................................ '+esc(signs.made)+'<br>Хянасан: ................................................ '+esc(signs.checked)+'<br>Баталсан: .............................................. '+esc(signs.approved)+'</div>';
  h+='</div></div>';
  return h;
}
function bindFactory(s,c,root){
  root=root||document;
  var imgs=factoryImages(s,c);
  $$('[data-fi]',root).forEach(function(im){ im.onclick=function(){ lightbox(imgs,Number(im.getAttribute('data-fi'))); }; });
  $$('[data-limg]',root).forEach(function(im){ im.onclick=function(){ var ids=((s.data.logo||{})[im.getAttribute('data-limg')]||{}).imgs||[]; lightbox(ids.map(function(id){return {id:id,cap:'Лого'};}),Number(im.getAttribute('data-i'))); }; });
  $$('[data-mimg]',root).forEach(function(im){ im.onclick=function(){ lightbox((s.data.matImgs||[]).map(function(id){return {id:id,cap:'Материал'};}),Number(im.getAttribute('data-mimg'))); }; });
  var p=$('#fvPrint',root); if(p) p.onclick=function(){ window.print(); };
}

function start(){
  var p={}; location.search.replace(/^\?/,'').split('&').forEach(function(kv){ if(!kv) return; var i=kv.indexOf('='); p[decodeURIComponent(i<0?kv:kv.slice(0,i))]=decodeURIComponent(i<0?'':kv.slice(i+1)); });
  $('#app').innerHTML='<div class="err-page"><p class="muted">Ачаалж байна…</p></div>';
  api('boot',p).then(function(b){
    BOOT=b; BOOT.base=location.origin+location.pathname;
    if(b.title) document.title=b.title;
    S.mode=b.mode; S.list=b.list||[]; S.catalog=b.catalog||[]; S.settings=b.settings||{};
    AUTH = b.mode==='admin' ? {k:b.key} : b.mode==='customer' ? {t:b.token} : {};
    render();
  }).catch(function(e){ BOOT={mode:'error',error:'Сервертэй холбогдож чадсангүй: '+e.message}; S.mode='error'; render(); });
}
window.addEventListener('beforeunload',function(e){ if(Object.keys(S.pending).length){ flushSave(); e.preventDefault(); e.returnValue=''; } });
start();
</script>
